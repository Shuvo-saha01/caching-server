services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - PORT=${PORT:-5000}
      - HOST=0.0.0.0
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
